<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Durable Actors Chat</title>
  <link rel="icon" href="/static/armadillo.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/panes.js"></script>
</head>
<body>
  <main id="panes" class="panes" aria-label="Chat workspace"></main>
  <template id="chat-pane">
    <section class="pane" aria-label="Chat pane" data-loading="true">
      <header class="topbar">
        <div class="brand-group">
          <img class="brand-mark" src="/static/armadillo.png" width="38" height="38" alt="Armadillo">
          <a class="brand" href="/">Durable Actors Chat</a>
          <span data-ref="connection" class="connection" data-state="connecting" role="status" title="Connecting">
            <span data-ref="connection-label" class="sr-only">Connecting</span>
          </span>
        </div>
        <form data-ref="room-form" class="room-controls">
          <input data-ref="room" aria-label="Chat ID" placeholder="enter in the id" maxlength="64" pattern="[a-zA-Z0-9_-]+" required value="lobby">
          <button type="submit">Open</button>
          <button data-ref="reset" class="reset" type="button" aria-label="Reset chat" title="Reset chat" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </form>
        <div class="pane-tools" role="group" aria-label="Pane controls">
          <button type="button" data-action="horizontal" aria-label="Split horizontally" aria-keyshortcuts="Meta+N" title="Split horizontally · ⌘N">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/></svg>
          </button>
          <button type="button" data-action="vertical" aria-label="Split vertically" aria-keyshortcuts="Meta+M" title="Split vertically · ⌘M">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg>
          </button>
          <button type="button" data-action="close" aria-label="Close pane" title="Close pane">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <div class="workspace">
        <div data-ref="scroll-area" class="scroll-area">
          <div data-ref="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
        </div>
        <div class="composer-area">
          <form data-ref="composer" class="composer">
            <textarea data-ref="message" aria-label="Your message" rows="2" maxlength="8000" placeholder="Send a message…" required></textarea>
            <button data-ref="send" class="send" type="submit" disabled>Send <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
          </form>
          <div class="shortcut-hint"><span><kbd>⌘ N</kbd> split down</span><span><kbd>⌘ M</kbd> split right</span></div>
        </div>
        <div class="loading" role="status">
          <div class="loading-mascot"><img src="/static/armadillo.png" width="128" height="128" alt=""><span class="loading-ground"></span></div>
          <p>Getting your chat ready<span class="loading-dots" aria-hidden="true">…</span></p>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
